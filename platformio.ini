[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM7
monitor_port = COM7
; 3 MiB app for token art; separate 128 KiB NVS for the expanded catalog.
; App and original NVS offsets stay unchanged to migrate existing saves.
board_build.partitions = partitions.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bitbank2/JPEGDEC@^1.6.1
build_flags =
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DILI9341_2_DRIVER=1
    -DTFT_INVERSION_ON=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000

; Debug build for README screenshots: tools/screenshot.py taps and captures over serial.
[env:shots]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DCYD_SERIAL_SHOTS=1
    -DCYD_NO_EMBEDDED_ART=1